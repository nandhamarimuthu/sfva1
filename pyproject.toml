[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyforge-vulnerable-aws-fixture"
version = "0.1.0"
description = "Intentionally misconfigured AWS/Terraform fixture for security and cost scanner testing"
requires-python = ">=3.10"
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "moto[sqs,s3,ec2,iam]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["unit-tests", "functional-tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["main/code"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
